{% extends 'quiz/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/css">
      a:link {
        text-decoration: none;
      }
  
      .order-card {
        color: rgb(255, 255, 255);
      }
  
      .bg-c-blue {
        background: #04868f;
      }
  
      .bg-c-green {
        background:#4C51BF;
      }
  
      .bg-c-yellow {
        background: #F56565;
      }
  
      .bg-c-pink {
        background: #663a30;
      }
  
  
      .card {
        
        -webkit-box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
        box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
        border: 1px solid black;
        margin-bottom: 30px;
        -webkit-transition: all 0.3s ease-in-out;
        transition: all 0.3s ease-in-out;
      }
  
      .card .card-block {
        padding: 25px;
      }
  
      .order-card i {
        font-size: 26px;
      }
  
      .f-left {
        float: left;
      }
  
      .f-right {
        float: right;
      }
      header {
      left: 0px;
      right: 0px;
    }

    .card-container{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
}

.card-box{
    width:360px;
    height:220px;
    border-radius:25px;
    padding:35px;
    color:#fff;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    justify-content:center;
    transition:0.4s;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.card-box:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(0,0,0,.45);
}

.card-box i{
    font-size:55px;
    margin-bottom:15px;
}

.card-box h2{
    font-size:34px;
    margin:0;
}

.card-box p{
    margin-top:10px;
    font-size:18px;
}

.add-card{
    background:linear-gradient(135deg,#37d5ff,#00b8ff);
}

.view-card{
    background:linear-gradient(135deg,#ff7a18,#ff4b2b);
}
/* Refresh Animation */

/* Page Load Animation */

body{
    animation: pageLoad .8s ease;
}

@keyframes pageLoad{
    0%{
        opacity:0;
        transform:translateY(20px);
    }
    100%{
        opacity:1;
        transform:translateY(0);
    }
}






    </style>
  </head>


  

   <div class="card-container">

    <a href="{% url 'admin-view-course' %}" class="card-box view-card">
        <i class="fa fa-eye"></i>
        <h2>View Course</h2>
        <p>Manage all courses</p>
    </a>

</div>

</div>
  
     
  
     
    </div>
  </div>



<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>


{% endblock content %}
