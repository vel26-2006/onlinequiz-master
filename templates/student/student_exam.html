{% extends 'student/studentbase.html' %}
{% block content %}
{%load static%}

<head>
  <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
  <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
  <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>

  <style media="screen">
    a:link {
      text-decoration: none;
    }

    h6 {
      text-align: center;
    }

    .row {
      margin: 100px;
    }

    body{
    background:
        radial-gradient(circle at top left,#3b82f6 0%,transparent 35%),
        radial-gradient(circle at bottom right,#06b6d4 0%,transparent 35%),
        linear-gradient(135deg,#050b24 0%,#0f2d75 45%,#2563eb 100%);
    background-attachment:fixed;
    background-size:cover;
    background-repeat:no-repeat;
}
    
/* Remove white background */
body{
    background: linear-gradient(135deg,#061a40,#1b4dd8,#28c7fa);
    min-height:100vh;
}

.container,
.container-fluid,
.jumbotron,
.well,
.card,
.content,
.content-wrapper{
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
}

/* Glass panel */
.panel{
    background: rgba(15,23,42,.75) !important;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: none !important;
    border-radius: 25px;
    box-shadow: 0 20px 45px rgba(0,0,0,.45);
}
    .container{
    max-width:1100px;
    margin:40px auto;
}

.panel{
    background:rgba(13,20,45,.75);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
    animation:fadeIn .8s ease;
}

.panel-heading{
    text-align:center;
    margin-bottom:20px;
}

.panel-title{
    color:#fff;
    font-size:42px;
    font-weight:700;
}

.table{
    width:100%;
    overflow:hidden;
    border-radius:18px;
    border-collapse:collapse;
}

.sidebar{
    position: fixed;
    top: 70px;
    left: -250px;
    width: 250px;
    height: calc(100vh - 70px);

    background: rgba(10, 15, 25, 0.65);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-right: 1px solid rgba(255,255,255,0.08);
    box-shadow: 8px 0 25px rgba(0,0,0,0.45);

    transition: all .35s ease;
    z-index: 999;
}

.table thead{
    background:linear-gradient(90deg,#20d4ff,#2b7cff);
}

.table thead th{
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:18px;
    font-weight:600;
}

.table tbody td{
    background:rgba(255,255,255,.08);
    color:#fff;
    text-align:center;
    padding:16px;
    border-top:1px solid rgba(255,255,255,.12);
    transition:.35s;
}

.table tbody tr:hover td{
    background:rgba(32,212,255,.18);
    transform:scale(1.01);
}

.table img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:3px solid #27c8ff;
}

.btn-view{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    color:#fff;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    transition:.35s;
}

.btn-view:hover{
    transform:scale(1.15);
    box-shadow:0 0 18px #22d3ee;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   MOBILE VIEW ONLY
   ========================= */
@media (max-width: 768px) {

    body {
        padding: 10px !important;
    }

    .exam-page {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .exam-title {
        font-size: 24px !important;
        margin-bottom: 18px !important;
    }

    .exam-table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: fixed;
        border-radius: 20px !important;
    }

    .exam-table th,
    .exam-table td {
        padding: 12px 5px !important;
        font-size: 13px !important;
    }

    /* Exam Name */
    .exam-table th:first-child,
    .exam-table td:first-child {
        width: 55% !important;
        word-break: break-word;
    }

    /* Take Exam */
    .exam-table th:last-child,
    .exam-table td:last-child {
        width: 45% !important;
    }

    .attempted-label {
        font-size: 9px !important;
        padding: 5px 4px !important;
        white-space: nowrap;
    }

    .exam-btn {
        width: 36px !important;
        height: 32px !important;
    }
}


/* Small mobile */
@media (max-width: 400px) {

    body {
        padding: 7px !important;
    }

    .exam-title {
        font-size: 22px !important;
    }

    .exam-table th,
    .exam-table td {
        padding: 10px 4px !important;
        font-size: 12px !important;
    }

    .attempted-label {
        font-size: 8px !important;
        padding: 5px 3px !important;
    }
}
  </style>



</head>

<div class="container">
  <div class="panel panel-primary">
    <div class="panel-heading">
      <h6 class="panel-title">Courses</h6>
    </div>

    
    <table class="table table-hover" id="dev-table">
      <thead>
        <tr>

          <th>Exam Name</th>
          
          <th>Take Exam</th>
        </tr>
      </thead>
      {% for t in courses %}
<tr>
    <td>{{ t.course_name }}</td>

    <td>
        {% if t.id in attempted_courses %}
            <span class="label label-success">Already Attempted</span>
        {% else %}
            <a class="btn btn-danger btn-xs" href="{% url 'take-exam' t.id %}">
                <span class="glyphicon glyphicon-circle-arrow-right"></span>
            </a>
        {% endif %}
    </td>
</tr>
{% endfor %}
    </table>
  </div>
</div>

{% endblock content %}
